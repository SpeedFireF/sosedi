<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My GitHub Pages Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <span class="badge">GitHub Pages</span>
    <h1>My test page is working!</h1>
    <p id="message">The HTML and CSS loaded successfully.</p>

    <button id="test-button" type="button">
      Test JavaScript (<span id="click-count">0</span>)
    </button>

    <p class="status" id="status" aria-live="polite">
      Click the button to test the script.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
